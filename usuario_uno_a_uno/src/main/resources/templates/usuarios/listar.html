<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Lista de Usuarios</h1>
        <a th:href="@{/usuarios/nuevo}" class="btn btn-primary mb-3">Nuevo Usuario</a>

        <!-- Formulario de búsqueda por nombre de usuario -->
        <form th:action="@{/usuarios/buscar}" method="get" class="mb-3">
            <div class="input-group">
                <input type="text" name="nombre" class="form-control" placeholder="Buscar por nombre">
                <button type="submit" class="btn btn-secondary">Buscar</button>
            </div>
        </form>
		
		<!-- Formulario de búsqueda por rol con select -->
		<form th:action="@{/usuarios/buscar}" method="get" class="mb-3">
		    <div class="input-group">
		        <select name="rol" class="form-control">
		            <option value="">Seleccionar rol</option>
		            <option th:each="rol : ${roles}" th:value="${rol}" th:text="${rol}"></option>
		        </select>
		        <button type="submit" class="btn btn-warning">Filtrar</button>
		    </div>
		</form>

        <!-- Tabla de usuarios -->
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre de Usuario</th>
                    <th>Email</th>
                    <th>Teléfono</th>
					<th>Rol</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.id}"></td>
                    <td th:text="${usuario.username}"></td>
                    <td th:text="${usuario.informacionUsuario.email}"></td>
                    <td th:text="${usuario.informacionUsuario.telefono}"></td>
					<td th:text="${usuario.rol}"></td>
                    <td>
                        <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/usuarios/eliminar/{id}(id=${usuario.id})}" class="btn btn-danger btn-sm">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Paginación -->
        <nav>
            <ul class="pagination">
                <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                    <a class="page-link" th:href="@{/usuarios(page=${currentPage - 1}, size=${10})}">Anterior</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/usuarios(page=${i}, size=${10})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/usuarios(page=${currentPage + 1}, size=${10})}">Siguiente</a>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>
