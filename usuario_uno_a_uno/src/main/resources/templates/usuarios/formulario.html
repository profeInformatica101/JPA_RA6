<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 th:text="${usuario.id == null} ? 'Nuevo Usuario' : 'Editar Usuario'"></h1>
      <form th:action="@{/usuarios/guardar}" method="post" th:object="${usuario}">
            <input type="hidden" th:field="*{id}">
<input type="hidden" th:field="*{informacionUsuario.id}">

            <!-- Campo Username -->
            <div class="mb-3">
                <label for="username" class="form-label">Nombre de Usuario</label>
                <input type="text" class="form-control" id="username" th:field="*{username}" >
                <div th:if="${#fields.hasErrors('username')}" class="text-danger">
                    <span th:each="error : ${#fields.errors('username')}" th:text="${error}"></span>
                </div>
            </div>

            <!-- Campo Password -->
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="text" class="form-control" id="password" th:field="*{password}" >
                <div th:if="${#fields.hasErrors('password')}" class="text-danger">
                    <span th:each="error : ${#fields.errors('password')}" th:text="${error}"></span>
                </div>
            </div>

            <!-- Campo Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" th:field="*{informacionUsuario.email}" >
                <div th:if="${#fields.hasErrors('informacionUsuario.email')}" class="text-danger">
                    <span th:each="error : ${#fields.errors('informacionUsuario.email')}" th:text="${error}"></span>
                </div>
            </div>

            <!-- Campo Teléfono -->
            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="text" class="form-control" id="telefono" th:field="*{informacionUsuario.telefono}" >
                <div th:if="${#fields.hasErrors('informacionUsuario.telefono')}" class="text-danger">
                    <span th:each="error : ${#fields.errors('informacionUsuario.telefono')}" th:text="${error}"></span>
                </div>
            </div>
			
			<!-- Campo Rol -->
			<label for="rol" class="form-label">Tipo de Rol </label>
			<select id="rol" name="rol" class="form-select" th:field="*{rol}">
				<option th:value="${rol}" th:text="${rol}" th:each="rol : ${roles}"></option>
			</select>
			
			
            <!-- Botones -->
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
