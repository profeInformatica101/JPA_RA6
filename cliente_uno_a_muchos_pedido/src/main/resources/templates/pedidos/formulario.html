<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 th:text="${pedido.id == null} ? 'Nuevo Pedido' : 'Editar Pedido'"></h1>

        <form th:action="@{/pedidos/guardar}" method="post" th:object="${pedido}">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <input type="text" class="form-control" id="descripcion" th:field="*{descripcion}" >
                <div th:if="${#fields.hasErrors('descripcion')}" class="text-danger">
                    <span th:each="error : ${#fields.errors('descripcion')}" th:text="${error}"></span>
                </div>
            </div>

            <div class="mb-3">
                <label for="cantidad" class="form-label">Cantidad</label>
                <input type="number" class="form-control" id="cantidad" th:field="*{cantidad}" >
                <div th:if="${#fields.hasErrors('cantidad')}" class="text-danger">
                    <span th:each="error : ${#fields.errors('cantidad')}" th:text="${error}"></span>
                </div>
            </div>

            <div class="mb-3">
                <label for="cliente" class="form-label">Cliente</label>
                <select class="form-control" id="cliente" th:field="*{cliente.id}" >
                    <option value="">Seleccione un cliente</option>
                    <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nombre}"></option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/pedidos}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
