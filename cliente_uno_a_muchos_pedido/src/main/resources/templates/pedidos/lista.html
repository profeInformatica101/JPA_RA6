<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Pedidos</h1>
        <a href="/pedidos/nuevo" class="btn btn-primary mb-3">Agregar Pedido</a>
		<a th:href="@{/productos}" class="btn btn-primary mb-3">Ver Productos</a>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Descripción</th>
                    <th>Cantidad</th>
                    <th>Cliente</th>
					<th>Productos</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pedido : ${pedidos}">
                     <td th:text="${pedido.descripcion}"></td>
                    <td th:text="${pedido.cantidad}"></td>
                    <td th:text="${pedido.cliente != null ? pedido.cliente.nombre : 'Sin Cliente'}"></td>
					<td> 
						<ul>
							<li th:each="producto : ${pedido.productos}" th:text="${producto.nombre}"></li>
						</ul>
					</td>
                    <td>
                        <a th:href="@{/pedidos/editar/{id}(id=${pedido.id})}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/pedidos/eliminar/{id}(id=${pedido.id})}" class="btn btn-danger btn-sm">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <div th:if="${#lists.isEmpty(pedidos)}">
            <p class="text-muted">No hay pedidos registrados.</p>
        </div>
    </div>
</body>
</html>
